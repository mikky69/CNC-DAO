[package]
name = "naturre"
version = "0.1.0"
description = "CNC DAO (Naturre) Solana Smart Contract"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "naturre"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
mpl-core = { version = "0.7.0" }
